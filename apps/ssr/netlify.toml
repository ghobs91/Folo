[build]
  base = "apps/ssr"
  command = "cd ../.. && pnpm run build --filter=@follow/ssr"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"

# Serve static assets directly
[[redirects]]
  from = "/dist-external/*"
  to = "/dist-external/:splat"
  status = 200

# Route everything else to the serverless function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["lightningcss", "@resvg/resvg-js"]
