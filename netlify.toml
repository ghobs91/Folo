# Netlify configuration for Follow SSR
[build]
  base = "apps/ssr"
  command = "cd ../../ && pnpm install && pnpm --filter=@follow/ssr run build:netlify"
  functions = "netlify/functions"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

# Serve static assets directly
[[redirects]]
  from = "/dist-external/*"
  to = "/dist-external/:splat"
  status = 200

# Route everything else to the serverless function
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server/:splat"
  status = 200

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["lightningcss", "@resvg/resvg-js"]
  included_files = ["dist/server/**"]
